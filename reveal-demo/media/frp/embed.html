<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FRP tracker embed</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff;
      }
      .stage {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: #fff;
      }
      #sim {
        display: block;
        /* Intrinsic size fixed; JS sets CSS size with uniform scale. */
        background: #fff;
        cursor: crosshair;
      }
      .stage-buttons {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }
      #status {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas id="sim" width="960" height="720"></canvas>
    </div>
    <div class="stage-buttons">
      <button type="button" data-btn="stage-prior">stage-prior</button>
      <button type="button" data-btn="stage-obs">stage-obs</button>
      <button type="button" data-btn="stage-hidden">stage-hidden</button>
      <button type="button" data-btn="stage-particles">stage-particles</button>
      <button type="button" data-btn="particles">particles</button>
      <button type="button" data-btn="observations">observations</button>
      <button type="button" data-btn="latent">latent</button>
      <button type="button" data-btn="prior">prior</button>
      <button type="button" data-btn="mouse">mouse</button>
      <button type="button" data-restart>restart</button>
    </div>
    <p id="status">Loading…</p>
    <script>
      // Uniform letterbox: never let CSS stretch the canvas nonuniformly.
      function fitSim() {
        const c = document.getElementById("sim");
        const stage = c.parentElement;
        const pw = stage.clientWidth;
        const ph = stage.clientHeight;
        if (pw < 2 || ph < 2) return;
        const ar = c.width / c.height;
        let w = pw;
        let h = w / ar;
        if (h > ph) {
          h = ph;
          w = h * ar;
        }
        c.style.width = `${Math.floor(w)}px`;
        c.style.height = `${Math.floor(h)}px`;
      }
      window.addEventListener("resize", fitSim);
      new ResizeObserver(fitSim).observe(document.body);
      fitSim();
    </script>
    <script type="module" src="./run.js"></script>
  </body>
</html>
