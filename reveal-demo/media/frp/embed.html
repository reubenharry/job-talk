<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FRP tracker embed</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff;
      }
      #sim {
        display: block;
        width: 100%;
        height: 100%;
        background: #fff;
        cursor: crosshair;
      }
      /* Keep stage buttons in the DOM for WASM button binding. */
      .stage-buttons {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }
      #status {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="sim" width="960" height="720"></canvas>
    <div class="stage-buttons">
      <button type="button" data-btn="stage-prior">stage-prior</button>
      <button type="button" data-btn="stage-obs">stage-obs</button>
      <button type="button" data-btn="stage-hidden">stage-hidden</button>
      <button type="button" data-btn="stage-particles">stage-particles</button>
      <button type="button" data-btn="particles">particles</button>
      <button type="button" data-btn="observations">observations</button>
      <button type="button" data-btn="latent">latent</button>
      <button type="button" data-btn="prior">prior</button>
      <button type="button" data-btn="mouse">mouse</button>
      <button type="button" data-restart>restart</button>
    </div>
    <p id="status">Loading…</p>
    <script type="module" src="./run.js"></script>
  </body>
</html>
